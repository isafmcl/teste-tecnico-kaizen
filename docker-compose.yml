services:
  loja:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - path: backend/.env
        required: true
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_PATH: /data/ecommerce.db
    volumes:
      - dados-loja:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  dados-loja:
